name: tick
on:
  schedule:
    - cron: "*/10 14-23,0-5 * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 100 --retry 2 -H "x-cron-secret: $CRON_SECRET" "https://nba-pinnacle-tracker.onrender.com/tick"
